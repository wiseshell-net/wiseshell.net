name: Build site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola v0.23.5
        run: |
          curl -fsSL \
            https://github.com/getzola/zola/releases/download/v0.23.5/zola-v0.23.5-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin zola
          zola --version

      - name: Build site
        run: zola build

      - name: Commit docs for GitHub Pages
        run: |
          if git diff --quiet -- docs; then
            echo "No changes in docs/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: rebuild docs [skip ci]"
          git push
